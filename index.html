<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Search App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Music Search</h1>
    <input type="text" id="searchInput" placeholder="Search for a track..." />
    <button id="searchButton">Search</button>
  </header>
  <main>
    <section id="soundcloudResults">
      <h2>SoundCloud</h2>
      <div id="soundcloudContainer"></div>
    </section>
    <section id="youtubeResults">
      <h2>YouTube</h2>
      <div id="youtubeContainer"></div>
    </section>
    <section id="spotifyResults">
      <h2>Spotify</h2>
      <div id="spotifyContainer"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
